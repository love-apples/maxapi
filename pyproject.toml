[project]
name = "maxapi"
version = "1.2.3"
description = "Библиотека для разработки чат-ботов с помощью API мессенджера MAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Denis", email = "bestloveapples@gmail.com" }]
keywords = ["max", "api", "bot"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13,<4",
    # Нижние границы проверяются ногой lowest-direct в CI:
    # backoff 2.2 — details["exception"] в on_backoff; magic_filter 1.0.4 —
    # MagicT; pydantic 2.12 — сериализация computed-поля url поверх alias
    # (и первые wheel-ы pydantic-core под Python 3.14).
    "backoff>=2.2,<3",
    "magic_filter>=1.0.4,<2",
    "pydantic>=2.12,<3",
    "aiofiles>=24.1,<26",
    "puremagic>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/love-apples/maxapi"
Documentation = "https://love-apples.github.io/maxapi/"
Repository = "https://github.com/love-apples/maxapi"
Issues = "https://github.com/love-apples/maxapi/issues"
Changelog = "https://github.com/love-apples/maxapi/releases"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: пакет maxapi/ лежит в корне, а не в src/.
module-root = ""
# В wheel уходит только maxapi/; в sdist дополнительно тесты и примеры.
source-include = ["tests/**", "examples/**"]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.103.0,<1",
    "uvicorn>=0.15.0,<1",
]
litestar = [
    # litestar < 2.3 несовместим с logging.config Python 3.12+.
    "litestar>=2.0.0,<3; python_version < '3.12'",
    "litestar>=2.3.0,<3; python_version >= '3.12'",
    "uvicorn>=0.15.0,<1",
]
# алиас для обратной совместимости с maxapi[webhook]
webhook = ["maxapi[fastapi]"]

[dependency-groups]
dev = [
    "maxapi[fastapi,litestar]",
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15",
    "mypy>=1.19.1",
    "types-aiofiles>=25.1.0",
    "pre-commit>=4.0",
    "coverage>=7.13",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
    "pymdown-extensions>=10.21",
    "python-dotenv>=1.2.1",
    "Faker>=40.4.0",
    # httpx 0.28 убрал app= в Client: TestClient старых fastapi/litestar
    # (нижние границы extras) с ним не работает.
    "httpx>=0.27,<1",
    "aresponses>=3.0.0,<4",
]

# Инструменты CI: зафиксированы в uv.lock, обновляются через Dependabot.
ci = [
    "actionlint-py>=1.7",
    "zizmor>=1.0",
    "twine>=6.0",
    "check-wheel-contents>=0.6",
]

[tool.uv]
# Enable uv project management and include `dev` group by default when running/syncing
default-groups = ["dev"]
managed = true

[tool.mypy]
python_version = "3.10"
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Путь к тестам
testpaths = ["tests"]

# Автоматический режим для asyncio
asyncio_mode = "auto"

# Параметры запуска
addopts = "-ra --strict-markers -v -W ignore::pytest.PytestUnraisableExceptionWarning"

# Маркеры
markers = [
    "integration: интеграционные тесты, требующие реальный токен бота",
    "slow: медленные тесты",
]

# Фильтры предупреждений
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]


[tool.coverage.report]
# Порог покрытия unit-тестами.
fail_under = 90

[tool.ruff]
src = ["maxapi", "tests"]
line-length = 79
indent-width = 4
target-version = "py310"


[tool.ruff.lint]
# TODO: добавить BLE N PGH PLR TRY
select = ["ALL"]
ignore = [
    "BLE", # TODO: требует рефакторинга
    "ERA", # TODO: требует рефакторинга
    "N", # TODO: требует рефакторинга
    "PGH", # TODO: требует рефакторинга
    "PLR", # TODO: требует рефакторинга
    "TRY", # TODO: требует рефакторинга
    "RUF006", # TODO: требует рефакторинга
    "A",
    "ARG",
    "ANN",
    "COM812",
    "CPY",
    "D",
    "DTZ",
    "EXE",
    "EM",
    "FIX",
    "PLW1641",
    "TC006",
    "RET",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
    "SIM118",
    "TD",
    "TID",
]

flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ARG",
    "E402",
    "PL",
    "S",
    "SLF",
]
"examples/**.py" = [
    "INP001",
    "PTH",
    "ASYNC240",
    "PLC0415",
    "S",
    "T20",
    "FBT",
]
"maxapi/methods/send_message.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/methods/edit_message.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/connection/base.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/utils/updates.py" = [
    "C90", # TODO: требует рефакторинга
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
