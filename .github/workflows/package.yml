name: Package check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Отменяем только устаревшие прогоны PR; на push и при вызове из
# publish.yml группа по SHA, чтобы релизные прогоны не вставали в
# очередь друг за другом и не отменяли друг друга.
# Инфикс `-package-` обязателен: при вызове через `uses:` из
# publish.yml `github.workflow` резолвится в имя ВЫЗЫВАЮЩЕГО workflow,
# и без инфикса все четыре гейта попали бы в одну группу и встали бы
# в очередь друг за другом.
concurrency:
  group: >-
    ${{ github.workflow }}-package-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # dist из этого job уходит на PyPI: кеш рядом с необратимой
      # публикацией не используем (zizmor cache-poisoning).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: false

      # Только группа ci: twine и check-wheel-contents из uv.lock. Дальше
      # везде `uv run --no-sync`, иначе uv доустановит dev-группу и проект.
      - name: Install tools
        run: |
          uv sync --only-group ci --locked

      - name: Build sdist and wheel
        run: |
          uv build

      - name: Check package metadata
        run: |
          uv run --no-sync twine check dist/*

      # Ловит лишние top-level пакеты в wheel (например, examples/),
      # которые после установки засоряют site-packages пользователя.
      - name: Check wheel contents
        run: |
          uv run --no-sync check-wheel-contents dist/*.whl

      # Артефакт забирает job publish из publish.yml, чтобы на PyPI
      # ушло ровно то, что проверено здесь, без пересборки.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
