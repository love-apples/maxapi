name: Package check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          uv build

      - name: Check package metadata
        run: |
          uvx twine check dist/*

      # Ловит лишние top-level пакеты в wheel (например, examples/),
      # которые после установки засоряют site-packages пользователя.
      - name: Check wheel contents
        run: |
          uvx check-wheel-contents dist/*.whl
