name: Lint with ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Отменяем только устаревшие прогоны PR; на push и при вызове из
# publish.yml группа по SHA, чтобы релизные прогоны не вставали в
# очередь друг за другом и не отменяли друг друга.
# Инфикс `-lint-` обязателен: при вызове через `uses:` из
# publish.yml `github.workflow` резолвится в имя ВЫЗЫВАЮЩЕГО workflow,
# и без инфикса все четыре гейта попали бы в одну группу и встали бы
# в очередь друг за другом.
concurrency:
  group: >-
    ${{ github.workflow }}-lint-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      # Группа ci: actionlint и zizmor зафиксированы в uv.lock,
      # обновляются через Dependabot, а не «что сегодня в PyPI».
      - name: Install dependencies
        run: |
          uv sync --group dev --group ci --locked

      - name: Run ruff check
        run: |
          uv run --no-sync ruff check .

      - name: Run ruff format check
        run: |
          uv run --no-sync ruff format . --check

      # Проверяет сами workflow: синтаксис, контексты выражений и
      # shellcheck по блокам `run`.
      - name: Lint GitHub workflows
        run: |
          uv run --no-sync actionlint -color

      # Аудит безопасности workflow: инъекции, лишние права, плавающие
      # ссылки на actions, известные уязвимые версии (онлайн-проверки
      # через GH_TOKEN). Политика и исключения — в zizmor.yml.
      - name: Audit GitHub workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync zizmor --config zizmor.yml --format github \
            .github/workflows/
